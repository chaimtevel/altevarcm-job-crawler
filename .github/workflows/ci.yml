name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Pinned so a runner image change can't silently alter the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Crawler.sln
      - run: dotnet build Crawler.sln --no-restore --configuration Release
      # Unit and fixture integration tests run in-process; no Postgres or RabbitMQ needed.
      - run: dotnet test Crawler.sln --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Type-checks with tsc, then builds the production bundle with Vite.
      - run: npm run build
