# Credentials come from .env (gitignored). Copy .env.example to .env first.
# Demo/local setup only; a real deployment would use a secret manager.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    healthcheck:
      # `ping` passes before the AMQP listener is up; this waits until clients can actually connect.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Crawler.Api/Dockerfile
    environment:
      ConnectionStrings__Crawler: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DAPR_HTTP_ENDPOINT: "http://api-dapr:3500"
      DAPR_GRPC_ENDPOINT: "http://api-dapr:50001"
      DAPR_API_TOKEN: ${DAPR_API_TOKEN:?set in .env}
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Sidecars run on the normal network, so any service can be rebuilt on its own.
  # DAPR_API_TOKEN: apps → sidecar. APP_API_TOKEN: sidecar → worker message endpoint.
  api-dapr:
    image: daprio/daprd:1.18.9
    command:
      - ./daprd
      - --app-id=crawl-api
      - --app-port=8080
      - --app-channel-address=api
      - --dapr-listen-addresses=0.0.0.0
      - --resources-path=/dapr/components
      - --config=/dapr/config.yaml
    environment:
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      DAPR_API_TOKEN: ${DAPR_API_TOKEN:?set in .env}
    volumes:
      - ./dapr:/dapr:ro
    restart: on-failure
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Crawler.Worker/Dockerfile
    environment:
      ConnectionStrings__Crawler: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DAPR_HTTP_ENDPOINT: "http://worker-dapr:3500"
      DAPR_GRPC_ENDPOINT: "http://worker-dapr:50001"
      DAPR_API_TOKEN: ${DAPR_API_TOKEN:?set in .env}
      APP_API_TOKEN: ${APP_API_TOKEN:?set in .env}
    ports:
      - "5081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-dapr:
    image: daprio/daprd:1.18.9
    command:
      - ./daprd
      - --app-id=crawl-worker
      - --app-port=8080
      - --app-channel-address=worker
      - --dapr-listen-addresses=0.0.0.0
      - --resources-path=/dapr/components
      - --config=/dapr/config.yaml
    environment:
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      DAPR_API_TOKEN: ${DAPR_API_TOKEN:?set in .env}
      APP_API_TOKEN: ${APP_API_TOKEN:?set in .env}
    volumes:
      - ./dapr:/dapr:ro
    restart: on-failure
    depends_on:
      worker:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
